services:
  postgres:
    image: postgres:17-alpine
    container_name: buffet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buffet
      POSTGRES_PASSWORD: buffet
      POSTGRES_DB: buffet
    ports:
      - "5432:5432"
    volumes:
      - buffet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buffet -d buffet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  buffet-pgdata:
